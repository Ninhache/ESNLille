name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ninhache/esnlille

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      FONTS_SSH_KEY: ${{ secrets.FONTS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v7
      - if: env.FONTS_SSH_KEY != '' && vars.FONTS_REPOSITORY != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.FONTS_REPOSITORY }}
          ssh-key: ${{ secrets.FONTS_SSH_KEY }}
          path: fonts-private
      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            SITE_URL=${{ vars.SITE_URL || 'https://lille.esnfrance.org' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
