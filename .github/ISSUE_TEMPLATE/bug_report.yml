name: Bug
description: Something on the site is broken or wrong
labels: ["bug"]

body:
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: https://lille.esnfrance.org/...
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: |
        What happened, and what did you expect?

        If useful:
        - Steps to reproduce
        - Browser and device
    validations:
      required: true
