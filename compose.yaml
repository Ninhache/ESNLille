services:
  web:
    image: ghcr.io/ninhache/esnlille:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      HELLOASSO_CLIENT_ID: ${HELLOASSO_CLIENT_ID:-}
      HELLOASSO_CLIENT_SECRET: ${HELLOASSO_CLIENT_SECRET:-}
      HELLOASSO_MOCK: ${HELLOASSO_MOCK:-}
